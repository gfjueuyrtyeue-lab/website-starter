<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="หน้าเว็บตัวอย่างสำหรับปรับแต่งต่อ">
  <title>เว็บไซต์ของฉัน</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f4f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
    main { width: min(100%, 760px); padding: clamp(2rem, 7vw, 5rem); background: white; border: 1px solid #e2e8f0; border-radius: 24px; box-shadow: 0 24px 80px #17203312; }
    .tag { color: #2563eb; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .8rem; }
    h1 { margin: 1rem 0; font-size: clamp(2.4rem, 7vw, 4.6rem); line-height: 1.05; letter-spacing: -.04em; }
    p { max-width: 55ch; color: #536179; font-size: 1.1rem; line-height: 1.75; }
    a { display: inline-block; margin-top: 1rem; padding: .85rem 1.2rem; border-radius: 12px; background: #2563eb; color: white; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <div class="tag">เว็บไซต์ใหม่</div>
    <h1>ยินดีต้อนรับ</h1>
    <p>นี่คือหน้าเว็บตัวอย่างที่เตรียมไว้สำหรับคุณ ปรับชื่อ เนื้อหา สี และรูปภาพให้ตรงกับเว็บไซต์ที่ต้องการได้ใน Antigravity</p>
    <a href="mailto:hello@example.com">ติดต่อเรา</a>
  </main>
</body>
</html>
